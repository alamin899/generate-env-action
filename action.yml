name: 'Dynamic Environment File Generator'
description: 'Securely generate .env files and export to $GITHUB_ENV from repository Secrets and Variables, with template support.'
branding:
  icon: 'lock'
  color: 'green'

inputs:
  secrets_context:
    description: 'The JSON string of the secrets context (e.g. toJson(secrets))'
    required: true
  vars_context:
    description: 'The JSON string of the vars context (e.g. toJson(vars))'
    required: true
  exclude_keys:
    description: 'Comma-separated list of additional keys to exclude'
    required: false
    default: ''
  is_set_process_env:
    description: 'If true, exports all environment variables to GITHUB_ENV'
    required: false
    default: 'true'
  generate_env_files:
    description: 'Comma-separated list of .env files to generate (e.g. .env,.env.local). If empty, no files are generated.'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Set up Go runtime
      uses: actions/setup-go@v5
      with:
        go-version: '>=1.20'

    - name: Run Env Generator Script
      shell: bash
      env:
        SECRETS_CONTEXT: ${{ inputs.secrets_context }}
        VARS_CONTEXT: ${{ inputs.vars_context }}
        EXCLUDE_KEYS: ${{ inputs.exclude_keys }}
        IS_SET_PROCESS_ENV: ${{ inputs.is_set_process_env }}
        GENERATE_ENV_FILES: ${{ inputs.generate_env_files }}
      run: |
        go run ${{ github.action_path }}/generate_env.go
